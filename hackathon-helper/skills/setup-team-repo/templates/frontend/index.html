<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>POC Hackathon</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
      h1 { margin-bottom: 4px; }
      textarea { width: 100%; height: 90px; font-size: 15px; padding: 8px; box-sizing: border-box; }
      button { padding: 10px 16px; font-size: 16px; cursor: pointer; margin-top: 8px; }
      pre { background: #f4f4f5; padding: 12px; border-radius: 8px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>POC del team</h1>
    <p>Scheletro che cammina: scrivi qualcosa, Claude risponde.</p>
    <textarea id="prompt">Spiegami cos'e un hackathon in una frase.</textarea>
    <br />
    <button id="send">Invia a Claude</button>
    <h3>Risposta</h3>
    <pre id="out">—</pre>
    <script src="app.js"></script>
  </body>
</html>
